name: 体育館空き状況チェック

on:
  # スケジュールは cron-job.org から workflow_dispatch で発火(JST 7:00-23:00 毎時)
  # GitHub Actions の schedule は混雑時にドロップされるため使わない
  workflow_dispatch:

# 並行実行を禁止(cache.json の push 競合と重複メール送信を防ぐ)
concurrency:
  group: komae-gym-check
  cancel-in-progress: false

permissions:
  contents: write  # cache.json をコミットするために必要

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 空き状況チェック & 通知
        env:
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CHECK_DAYS: '30'
        run: python daily_check.py

      - name: cache.json をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json
          if git diff --staged --quiet; then
            echo "no cache changes"
            exit 0
          fi
          git commit -m "chore: update cache $(date +'%Y-%m-%d')"
          # 念のため pull --rebase で他 run のコミットを取り込んでから push
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "retry $i"
            sleep 3
          done
          exit 1
