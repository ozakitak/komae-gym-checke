name: 体育館空き状況チェック

on:
  schedule:
    # JST 7:00-23:00 を毎時実行(分は 5 に固定して混雑回避)
    # JST 7-9 時 = UTC 22-23 時(前日), 24 時 = UTC 翌 0 時 -> 22-23 UTC と 0-14 UTC
    - cron: '5 22-23 * * *'  # JST 7:00, 8:00
    - cron: '5 0-14 * * *'   # JST 9:00 - 23:00
  workflow_dispatch:       # 手動実行ボタン

permissions:
  contents: write  # cache.json をコミットするために必要

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 空き状況チェック & 通知
        env:
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CHECK_DAYS: '30'
        run: python daily_check.py

      - name: cache.json をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json
          git diff --staged --quiet || git commit -m "chore: update cache $(date +'%Y-%m-%d')"
          git push
